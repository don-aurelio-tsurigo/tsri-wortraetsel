<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Tsüri Worträtsel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --ink: #1A1A1B;
    --line: #D3D6DA;
    --correct: #3AA76D;
    --present: #F0A202;
    --absent: #86888C;
    --key-default: #D3D6DA;
    --cursor: #2F80ED;
    --tile-size: 62px;
    --tile-gap: 8px;
  }
  * { box-sizing: border-box; }
  button {
    -webkit-appearance: none;
    appearance: none;
    font: inherit;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    height: 100%;
  }
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 12px 16px;
    max-width: 460px;
    margin: 0 auto;
    min-height: 100%;
  }
  #message {
    min-height: 22px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
    text-align: center;
  }
  #message.error { color: #B3261E; }
  #message.success { color: var(--correct); }
  #board {
    display: grid;
    grid-template-rows: repeat(6, var(--tile-size));
    gap: var(--tile-gap);
    margin-bottom: 22px;
  }
  .row {
    display: grid;
    grid-template-columns: repeat(5, var(--tile-size));
    gap: var(--tile-gap);
  }
  .tile {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px;
    font-weight: 700;
    border: 2px solid var(--line);
    border-radius: 4px;
    background: #FFFFFF;
    text-transform: uppercase;
    transition: transform 0.15s ease;
  }
  .tile.filled { border-color: #A8A8A8; }
  .tile.cursor { border-color: var(--cursor); border-width: 3px; background: rgba(47, 128, 237, 0.08); }
  .tile.correct { background: var(--correct); border-color: var(--correct); color: #fff; }
  .tile.present { background: var(--present); border-color: var(--present); color: #fff; }
  .tile.absent { background: var(--absent); border-color: var(--absent); color: #fff; }
  .tile.pop { transform: scale(1.08); }
  .tile.shake { animation: shake 0.35s; }
  .tile.flip { animation: flipReveal 0.5s ease forwards; }
  @keyframes flipReveal {
    0% { transform: rotateX(0deg); }
    50% { transform: rotateX(90deg); }
    100% { transform: rotateX(0deg); }
  }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-6px); }
    40%, 60% { transform: translateX(6px); }
  }
  #keyboard {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
    max-width: 480px;
  }
  .kb-row {
    display: flex;
    justify-content: center;
    gap: 6px;
  }
  .key {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    min-width: 0;
    max-width: 40px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--key-default);
    border: none;
    outline: none;
    border-radius: 4px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    cursor: pointer;
    user-select: none;
    transition: background 0.15s ease;
  }
  .key:active { background: #BBBEC2; }
  .key.wide { max-width: 62px; font-size: 10px; }
  .key.enter { background: var(--cursor); color: #fff; }
  .key.delete { background: #5F6368; color: #fff; }
  .key.correct { background: var(--correct); color: #fff; }
  .key.present { background: var(--present); color: #fff; }
  .key.absent { background: var(--absent); color: #fff; }
  footer {
    margin-top: 18px;
    font-size: 11px;
    color: #948F7E;
    text-align: center;
  }
  @media (max-width: 480px) {
    :root { --tile-size: 46px; --tile-gap: 6px; }
    #app { padding: 8px 10px 10px; }
    #message { min-height: 16px; margin-bottom: 4px; }
    #board { margin-bottom: 12px; }
    #keyboard { gap: 6px; }
    .key { height: 40px; font-size: 13px; }
    footer { margin-top: 8px; }
  }

  /* ---- Success-Dialog ---- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
    animation: fadeIn 0.2s ease;
  }
  .modal-overlay.hidden { display: none; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: #fff;
    border-radius: 16px;
    padding: 32px 26px 24px;
    max-width: 320px;
    width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    text-align: center;
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.18);
    animation: popIn 0.25s ease;
  }
  @keyframes popIn {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .modal h2 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
  }
  .modal-subtitle {
    font-size: 13px;
    color: #8A8672;
    margin: 0 0 22px;
  }
  .modal-subtitle strong {
    color: var(--ink);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .share-grid {
    font-size: 22px;
    line-height: 1.4;
    white-space: pre-line;
    margin-bottom: 24px;
    user-select: none;
  }
  .icon-btn-row {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .icon-btn {
    -webkit-appearance: none;
    appearance: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    outline: none;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    transition: transform 0.1s ease, background 0.15s ease;
  }
  .icon-btn:active { transform: scale(0.92); }
  .icon-btn.whatsapp { background: #25D366; color: #fff; }
  .icon-btn.whatsapp:active { background: #1EBE5A; }
  .icon-btn.copy { background: #E5E1D5; color: var(--ink); }
  .icon-btn.copy:active { background: #D3CEBE; }
  .copy-feedback {
    min-height: 16px;
    font-size: 12px;
    color: var(--correct);
    font-weight: 600;
    margin: 4px 0 6px;
  }
  .modal-close {
    -webkit-appearance: none;
    appearance: none;
    background: none;
    border: none;
    outline: none;
    color: #6B6656;
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
  }
  .message-box {
    background: #F7F4EC;
    border-left: 3px solid #E8B84B;
    border-radius: 0 10px 10px 0;
    padding: 14px 16px;
    margin-bottom: 22px;
    text-align: left;
  }
  .message-box p {
    margin: 0;
    font-size: 13.5px;
    font-weight: 500;
    color: #55503E;
    line-height: 1.5;
  }
  .message-btn {
    display: inline-block;
    margin-top: 12px;
    padding: 7px 16px;
    background: #1A1A1B;
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    text-decoration: none;
    border-radius: 20px;
  }
  .message-btn:active { background: #333; }
  .message-btn.hidden { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="message"></div>
  <div id="board"></div>
  <div id="keyboard"></div>
  <footer>Ein Spiel von Tsüri.ch</footer>
</div>

<div id="successModal" class="modal-overlay hidden">

</div>

<div id="lossModal" class="modal-overlay hidden">

// Wenn die einbettende Seite ?member=1 an die Iframe-URL anhängt (z.B. für

// Sprüche für den Verloren-Fall – bei jedem Fehlversuch wird einer zufällig gezeigt
const LOSE_MESSAGES = [
  "Falsch! Aber tröste dich: Eine bezahlbare Wohnung im Kreis 3 zu finden, ist noch viel hoffnungsloser als dieses Rätsel.",

];

let state = {
  wordId: null,
  attempt: 0,
  letters: ["", "", "", "", ""],
  cursor: 0,
  board: [], // Array von { letters, feedback }
  finished: false,
  keyStates: {}, // Buchstabe -> "correct" | "present" | "absent"
  startTime: null,
  elapsedMs: null,
  solution: null,
  animating: false,
};

const boardEl = document.getElementById("board");
const keyboardEl = document.getElementById("keyboard");
const messageEl = document.getElementById("message");
const modalEl = document.getElementById("successModal");
const successTitleEl = document.getElementById("successTitle");
const successTimeEl = document.getElementById("successTime");
const successStreakEl = document.getElementById("successStreak");
const messageTextEl = document.getElementById("messageText");
const messageBtnEl = document.getElementById("messageBtn");
const shareGridEl = document.getElementById("shareGrid");
const shareWhatsappBtn = document.getElementById("shareWhatsapp");
const copyResultBtn = document.getElementById("copyResult");
const copyFeedbackEl = document.getElementById("copyFeedback");
const closeModalBtn = document.getElementById("closeModal");
const lossModalEl = document.getElementById("lossModal");
const lossSolutionEl = document.getElementById("lossSolution");
const lossStreakEl = document.getElementById("lossStreak");
const lossMessageTextEl = document.getElementById("lossMessageText");
const closeLossModalBtn = document.getElementById("closeLossModal");

function storageKey(wordId) {
  return "tsri_wortraetsel_state_" + wordId;
}

function loadLocalState(wordId) {
  try {
    const raw = localStorage.getItem(storageKey(wordId));
    if (!raw) return null;
    return JSON.parse(raw);
  } catch {
    return null;
  }
}

function saveLocalState() {
  if (!state.wordId) return;
  localStorage.setItem(
    storageKey(state.wordId),
    JSON.stringify({
      attempt: state.attempt,
      board: state.board,
      finished: state.finished,
      keyStates: state.keyStates,
      startTime: state.startTime,
      elapsedMs: state.elapsedMs,
      solution: state.solution,
    })
  );
}

// ---- Geräteweite Serie/Statistik (nicht an ein einzelnes Rätselwort
// gebunden, sondern über alle Runden hinweg auf diesem Browser/Gerät) ----
const GLOBAL_STATS_KEY = "tsri_wortraetsel_global_stats";

function loadGlobalStats() {
  const empty = { currentStreak: 0, maxStreak: 0, gamesPlayed: 0, gamesWon: 0, distribution: [0, 0, 0, 0, 0, 0], lastWordId: null };
  try {
    const raw = localStorage.getItem(GLOBAL_STATS_KEY);
    if (!raw) return empty;
    return { ...empty, ...JSON.parse(raw) };
  } catch {
    return empty;
  }
}

function saveGlobalStats(stats) {
  localStorage.setItem(GLOBAL_STATS_KEY, JSON.stringify(stats));
}

// Aktualisiert die Serie/Statistik – aber nur einmal pro Rätselwort, auch
// wenn der Erfolgs-/Verlust-Dialog später (z.B. nach einem Reload) nochmal
// angezeigt wird. Serie = aufeinanderfolgende gelöste Rätsel, nicht
// zwingend aufeinanderfolgende Kalendertage (weil das Wort nicht täglich,
// sondern nach Redaktionsplan wechselt).
function recordGameResult(won, attempts) {
  const stats = loadGlobalStats();
  if (stats.lastWordId === state.wordId) return stats; // schon gezählt
  stats.gamesPlayed += 1;
  if (won) {
    stats.gamesWon += 1;
    stats.currentStreak += 1;
    stats.maxStreak = Math.max(stats.maxStreak, stats.currentStreak);
    const idx = Math.min(Math.max(attempts, 1), 6) - 1;
    stats.distribution[idx] = (stats.distribution[idx] || 0) + 1;
  } else {
    stats.currentStreak = 0;
  }
  stats.lastWordId = state.wordId;
  saveGlobalStats(stats);
  return stats;
}

function setMessage(text, type) {
  messageEl.textContent = text || "";
  messageEl.className = type || "";
}

function renderBoard() {
  boardEl.innerHTML = "";
  for (let r = 0; r < MAX_ATTEMPTS; r++) {
    const row = document.createElement("div");
    row.className = "row";
    const submitted = state.board[r];
    const isCurrent = r === state.attempt && !state.finished;
    for (let c = 0; c < WORD_LENGTH; c++) {
      const tile = document.createElement("div");
      tile.className = "tile";
      if (submitted) {
        tile.textContent = submitted.letters[c] || "";
        tile.classList.add("filled", submitted.feedback[c]);
      } else if (isCurrent) {
        const letter = state.letters[c];
        if (letter) {
          tile.textContent = letter;
          tile.classList.add("filled");
        }
        if (c === state.cursor) {
          // Cursor: zeigt an, welcher Buchstabe als Nächstes gesetzt/ersetzt wird
          tile.classList.add("cursor");
        }
        tile.style.cursor = "pointer";
        tile.addEventListener("click", () => {
          if (state.finished || state.animating) return;
          state.cursor = c;
          renderBoard();
        });
      }
      row.appendChild(tile);
    }
    boardEl.appendChild(row);
  }
}

const FLIP_STAGGER_MS = 180; // Verzögerung zwischen den Kacheln einer Reihe
const FLIP_HALF_MS = 250; // halbe Flip-Dauer, bis die Farbe umschlägt

// Zeigt die Kacheln einer gerade abgeschickten Reihe nacheinander mit
// Flip-Animation an (statt alle sofort einzufärben). Gibt ein Promise
// zurück, das aufgelöst wird, sobald die letzte Kachel fertig geflippt ist.
function revealRow(rowIndex, letters, feedback) {
  const rowEl = boardEl.querySelectorAll(".row")[rowIndex];
  if (!rowEl) return Promise.resolve();
  const tiles = rowEl.querySelectorAll(".tile");

  return new Promise((resolve) => {
    tiles.forEach((tile, i) => {
      setTimeout(() => {
        tile.classList.add("flip");
        setTimeout(() => {
          tile.textContent = letters[i];
          tile.classList.add("filled", feedback[i]);
        }, FLIP_HALF_MS);
      }, i * FLIP_STAGGER_MS);
    });
    const totalMs = (tiles.length - 1) * FLIP_STAGGER_MS + FLIP_HALF_MS * 2;
    setTimeout(resolve, totalMs);
  });
}

function renderKeyboard() {
  keyboardEl.innerHTML = "";
  KEYBOARD_ROWS.forEach((rowKeys) => {
    const row = document.createElement("div");
    row.className = "kb-row";
    rowKeys.forEach((key) => {
      const btn = document.createElement("button");
      btn.className = "key" + (key.length > 1 ? " wide" : "");
      if (key === "ENTER") btn.classList.add("enter");
      if (key === "DELETE") btn.classList.add("delete");
      btn.textContent = key;
      const stateClass = state.keyStates[key];
      if (stateClass) btn.classList.add(stateClass);
      btn.addEventListener("click", () => handleKey(key));
      row.appendChild(btn);
    });
    keyboardEl.appendChild(row);
  });
}

function updateKeyStates(letters, feedback) {
  const priority = { absent: 0, present: 1, correct: 2 };
  letters.forEach((letter, i) => {
    const fb = feedback[i];
    const current = state.keyStates[letter];
    if (!current || priority[fb] > priority[current]) {
      state.keyStates[letter] = fb;
    }
  });
}

async function handleKey(key) {
  if (state.finished || state.animating) return;
  if (key === "ENTER") {
    submitGuess();
  } else if (key === "DELETE") {
    if (state.letters[state.cursor]) {
      // Aktuelles Feld ist gefüllt -> nur dieses leeren, Cursor bleibt
      state.letters[state.cursor] = "";
    } else if (state.cursor > 0) {
      // Aktuelles Feld ist schon leer -> einen zurück und das leeren
      state.cursor -= 1;
      state.letters[state.cursor] = "";
    }
    renderBoard();
  } else if (/^[A-ZÄÖÜ]$/.test(key)) {
    if (state.startTime === null) state.startTime = Date.now(); // Timer startet beim 1. Buchstaben
    state.letters[state.cursor] = key;
    if (state.cursor < WORD_LENGTH - 1) state.cursor += 1;
    renderBoard();
  }
}

function formatDuration(ms) {
  const totalSeconds = Math.max(0, Math.round(ms / 1000));
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return m + ":" + String(s).padStart(2, "0");
}

function buildShareGrid() {
  const emojiMap = { correct: "🟩", present: "🟧", absent: "⬜" };
  return state.board
    .slice(0, state.attempt)
    .map((row) => row.feedback.map((f) => emojiMap[f]).join(" "))
    .join("\n");
}

function showSuccessModal(globalStats) {
  const stats = globalStats || loadGlobalStats();
  const title = TITLE_WORDS[Math.floor(Math.random() * TITLE_WORDS.length)];
  successTitleEl.textContent = title + " 🎉";
  successStreakEl.textContent = "🔥 Serie: " + stats.currentStreak;

  const message = AVAILABLE_MESSAGES[Math.floor(Math.random() * AVAILABLE_MESSAGES.length)];
  messageTextEl.textContent = message.text;
  if (message.buttonLabel && message.buttonLink) {
    messageBtnEl.textContent = message.buttonLabel;
    messageBtnEl.href = message.buttonLink;
    messageBtnEl.classList.remove("hidden");
  } else {
    messageBtnEl.classList.add("hidden");
  }

  successTimeEl.textContent = state.elapsedMs !== null ? formatDuration(state.elapsedMs) : "–";
  const grid = buildShareGrid();
  shareGridEl.textContent = grid;
  // Je mehr Versuche gebraucht wurden, desto kleiner die Emojis – sonst wird
  // der Dialog bei 5-6 Reihen unnötig hoch.
  const rows = state.attempt;
  const gridFontSize = Math.max(14, 22 - (rows - 1) * 1.4);
  shareGridEl.style.fontSize = gridFontSize + "px";

  const shareText =
    "Tsüri Worträtsel ⏱ " + (state.elapsedMs !== null ? formatDuration(state.elapsedMs) : "?") +
    "\n" + grid +
    "\n\nZüri Briefing abonnieren und mitspielen: tsri.ch/briefing";
  shareWhatsappBtn.onclick = () => {
    // api.whatsapp.com statt wa.me: wa.me hat auf WhatsApp Web einen bekannten
    // Encoding-Bug, bei dem Emojis als "�" ankommen. api.whatsapp.com
    // funktioniert zuverlässig auf Mobile UND Web.
    window.open("https://api.whatsapp.com/send?text=" + encodeURIComponent(shareText), "_blank");
  };

  copyResultBtn.onclick = async () => {
    try {
      await navigator.clipboard.writeText(shareText);
      copyFeedbackEl.textContent = "In Zwischenablage kopiert!";
    } catch {
      copyFeedbackEl.textContent = "Kopieren nicht möglich.";
    }
    setTimeout(() => {
      copyFeedbackEl.textContent = "";
    }, 2000);
  };

  modalEl.classList.remove("hidden");
}

function showLossModal(solution, globalStats) {
  const stats = globalStats || loadGlobalStats();
  lossSolutionEl.textContent = solution || "?";
  lossStreakEl.textContent = "Serie: " + stats.currentStreak;
  const msg = LOSE_MESSAGES[Math.floor(Math.random() * LOSE_MESSAGES.length)];
  lossMessageTextEl.textContent = msg;
  lossModalEl.classList.remove("hidden");
}

closeLossModalBtn.addEventListener("click", () => {
  lossModalEl.classList.add("hidden");
});

closeModalBtn.addEventListener("click", () => {
  modalEl.classList.add("hidden");
});

async function submitGuess() {
  const guess = state.letters.join("");
  if (guess.length !== WORD_LENGTH || state.letters.some((l) => !l)) {
    setMessage("Zu wenig Buchstaben.", "error");
    shakeCurrentRow();
    return;
  }
  setMessage("");
  try {
    const res = await fetch(API_BASE + "/api/guess", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        guess: guess,
        attempt: state.attempt + 1,
        elapsedSeconds: state.startTime !== null ? Math.round((Date.now() - state.startTime) / 1000) : null,
      }),
    });
    const data = await res.json();

    if (!res.ok) {
      setMessage(data.error || "Fehler bei der Anfrage.", "error");
      return;
    }
    if (!data.validWord) {
      setMessage("Kein gültiges Wort.", "error");
      shakeCurrentRow();
      return;
    }

    const letters = guess.split("");
    const feedback = data.feedback;
    const currentRowIndex = state.attempt;

    state.animating = true;
    await revealRow(currentRowIndex, letters, feedback);
    state.animating = false;

    state.board[currentRowIndex] = { letters, feedback };
    updateKeyStates(letters, feedback);
    state.attempt += 1;
    state.letters = ["", "", "", "", ""];
    state.cursor = 0;
    state.wordId = data.wordId;

    if (data.solved) {
      state.finished = true;
      state.elapsedMs = state.startTime !== null ? Date.now() - state.startTime : null;
      const globalStats = recordGameResult(true, state.attempt);
      setMessage("");
      saveLocalState();
      renderBoard();
      renderKeyboard();
      showSuccessModal(globalStats);
      return;
    } else if (state.attempt >= MAX_ATTEMPTS) {
      state.finished = true;
      state.solution = data.solution || null;
      const globalStats = recordGameResult(false, state.attempt);
      saveLocalState();
      renderBoard();
      renderKeyboard();
      showLossModal(state.solution, globalStats);
      return;
    }

    saveLocalState();
    renderBoard();
    renderKeyboard();
  } catch (err) {
    setMessage("Verbindung zum Server fehlgeschlagen.", "error");
  }
}

function shakeCurrentRow() {
  const rows = boardEl.querySelectorAll(".row");
  const row = rows[state.attempt];
  if (!row) return;
  row.querySelectorAll(".tile").forEach((t) => t.classList.add("shake"));
  setTimeout(() => {
    row.querySelectorAll(".tile").forEach((t) => t.classList.remove("shake"));
  }, 350);
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Enter") handleKey("ENTER");
  else if (e.key === "Backspace") handleKey("DELETE");
  else if (e.key === "ArrowLeft") moveCursor(-1);
  else if (e.key === "ArrowRight") moveCursor(1);
  else if (/^[a-zA-ZäöüÄÖÜ]$/.test(e.key)) handleKey(e.key.toUpperCase());
});

function moveCursor(delta) {
  if (state.finished || state.animating) return;
  state.cursor = Math.min(WORD_LENGTH - 1, Math.max(0, state.cursor + delta));
  renderBoard();
}

// Bestmöglicher Versuch, den Tastatur-Fokus automatisch zu bekommen, ohne dass
// man zuerst ins Iframe klicken muss. Browser blockieren das teils bewusst bei
// eingebetteten Inhalten von einer anderen Domain (Sicherheitsmassnahme gegen
// Seiten, die heimlich Tastatureingaben abgreifen) – funktioniert darum nicht
// in jedem Browser gleich zuverlässig.
// In Safari (Desktop) verursacht der Versuch ein kurzes Flackern und blockiert
// danach 2-3 Sekunden lang Tastatureingaben, darum wird er dort übersprungen.
const isSafari = /^((?!chrome|android|crios|fxios|edg).)*safari/i.test(navigator.userAgent);
if (!isSafari) {
  window.addEventListener("load", () => {
    try {
      window.focus();
      document.body.setAttribute("tabindex", "-1");
      document.body.focus({ preventScroll: true });
    } catch {
      // Fokus-Anfrage wurde vom Browser blockiert – kein Problem, ein Klick reicht dann.
    }
  });
}

async function init() {
  renderBoard();
  renderKeyboard();
  try {
    const res = await fetch(API_BASE + "/api/status");
    const data = await res.json();
    if (!res.ok || !data.ok) {
      setMessage(data.error || "Aktuell ist kein Rätsel verfügbar.", "error");
      return;
    }
    state.wordId = data.wordId;
    const saved = loadLocalState(data.wordId);
    if (saved) {
      state.attempt = saved.attempt;
      state.board = saved.board;
      state.finished = saved.finished;
      state.keyStates = saved.keyStates || {};
      state.startTime = saved.startTime ?? null;
      state.elapsedMs = saved.elapsedMs ?? null;
      state.solution = saved.solution ?? null;
      if (state.finished) {
        const last = state.board[state.board.length - 1];
        if (last && last.feedback.every((f) => f === "correct")) {
          showSuccessModal();
        } else {
          showLossModal(state.solution);
        }
      }
    }
    renderBoard();
    renderKeyboard();
  } catch (err) {
    setMessage("Verbindung zum Server fehlgeschlagen.", "error");
  }
}

init();
</script>
